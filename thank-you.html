<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent | Shahein Advanced Solutions Inc.</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary-black: #000000;
        --dark-blue: #0047AB;
        --bright-blue: #4A90E2;
        --white: #FFFFFF;
        --light-gray: #E5E5E5;
    }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--primary-black);
        color: var(--light-gray);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }
    .card {
        max-width: 560px;
        text-align: center;
    }
    .logo {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.3rem;
        font-weight: 900;
        letter-spacing: 2px;
        color: var(--white);
        margin-bottom: 2.5rem;
    }
    .logo span { color: var(--dark-blue); }
    .checkmark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid var(--bright-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        font-size: 1.8rem;
        color: var(--bright-blue);
    }
    h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        color: var(--white);
        font-weight: 900;
        margin-bottom: 1rem;
    }
    p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--light-gray);
        margin-bottom: 2.5rem;
    }
    a.btn {
        display: inline-block;
        padding: 0.9rem 2.2rem;
        background: var(--dark-blue);
        color: var(--white);
        text-decoration: none;
        font-weight: 600;
        border-radius: 4px;
        transition: background 0.3s ease;
    }
    a.btn:hover { background: #003380; }
</style>
</head>
<body>
    <div class="card">
        <div class="logo">SAS<span>INC</span></div>
        <div class="checkmark">&#10003;</div>
        <h1>Message Sent</h1>
        <p>Thank you for reaching out to Shahein Advanced Solutions. We've received your message and will get back to you shortly.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
